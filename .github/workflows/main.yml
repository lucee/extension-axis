name: Java CI Combined

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lucee_versions:
        required: false
        description: Lucee Versions (json)
        default: '[ "7.0/snapshot/jar", "6.2/snapshot/jar", "6.2/stable/jar" ]'
        type: string
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "::set-output name=VERSION::$VERSION"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Build and Install with Maven
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axis-lex
          path: target/*.lex
  tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # max-parallel: 1
      matrix:
        luceeVersion: ${{ fromJSON(github.event.inputs.lucee_versions) }}
        javaVersion: [ 21 ]
    env:
        luceeVersionQuery: ${{ matrix.luceeVersion }}
        compile: ${{ github.event.inputs.compile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout lucee-testlab
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee-testlab
          path: testlab
      - name: Set up JDK ${{matrix.javaVersion}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.javaVersion}}
          distribution: "temurin"
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-cache
      - name: Cache Lucee files
        uses: actions/cache@v4
        if: always()
        with:
          path: /home/runner/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads
      - name: Cache Lucee Express files
        uses: actions/cache@v4
        if: always()
        with:
          path: ~/lucee-express-cache/
          key: lucee-express

      - name: Download Linux Installer Arm artifact
        uses: actions/download-artifact@v4
        with:
          name: axis-lex

      - name: Download Lucee Express
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/testlab/custom/axis
          execute: /fetch-express.cfm
          luceeVersionQuery: ${{ matrix.luceeVersion }}
        env:
          fetch: ${{ matrix.luceeVersion }}
      - name: Run Express
        run: |
          export LUCEE_LOGGING_FORCE_LEVEL="trace"
          mkdir ./express/lucee-server/deploy/
          cp ${{ github.workspace }}/testlab/custom/rest/.CFConfig.json ./express/lucee-server/deploy/.CFConfig.json
          cp *.lex ./express/lucee-server/deploy/
          echo "webweb" > ./express/lucee-server/context/password.txt
          ./express/bin/startup.sh
          echo "sleeping for 10s to allow lucee to deploy and startup...."
          sleep 10
          curl http://127.0.0.1:8888
      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee
      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersionQuery: ${{ matrix.luceeVersion }}
        env:
          testLabels: axis
          testAdditional: ${{ github.workspace }}/testlab/custom/axis/tests
      - name: Debug Express exception.log
        if: failure()
        run: |
            echo "------ deploy.log ----------"
            cat express/lucee-server/context/logs/deploy.log
            echo "------ rest.log ----------"
            cat express/lucee-server/context/logs/rest.log
            echo "------ application.log ----------"
            cat express/lucee-server/context/logs/application.log
            echo "------ exception.log ----------"
            cat express/lucee-server/context/logs/exception.log

  deploy:
    runs-on: ubuntu-latest
    needs: [ tests ]
    if: always() && needs.tests.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${{ needs.setup.outputs.version }}" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy --settings maven-settings.xml
          else
            echo "------- Maven Deploy release on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          fi
